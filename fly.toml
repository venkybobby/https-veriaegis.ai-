# fly.toml app configuration file generated for veriaegis-ai on 2026-06-01T23:30:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'veriaegis-ai'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
